<!DOCTYPE html>
<html>
<head>
  <meta name="description" content="Math.js | my tinkering">
  <title>Math.js | my tinkering</title>
  <script src="https://unpkg.com/mathjs/lib/browser/math.js"></script>
</head>
<body>
  <script>
    // My Math.js tinkering
    // I changed the numbers in the examples to test different results.

    // functions and constants
    print(math.round(math.pi, 2));
    print(math.log(1000, 10));   
    print(math.sqrt(64));         
    print(math.pow(2, 6));        

    // Find the smallest and largest numbers in my list
    print(math.min(3, 10, 1, 2, 1, 6, 4, 6, 5, 7, 8, 1)); 
    print(math.max(3, 10, 1, 2, 1, 6, 4, 6, 5, 7, 8, 1)); 

    // expressions
    print(math.evaluate('3 * (10 + 2)')); 
    print(math.evaluate('2010 / 48'));    
    print(math.evaluate('48 cm to inch'));

    // chaining
    var answer = math.chain(3)
        .add(10)
        .multiply(2)
        .done();

    print(answer); // 26

    // helper function to output formatted results
    function print(value) {
      var precision = 14;
      document.write(math.format(value, precision) + '<br>');
    }
  </script>
</body>
</html>
